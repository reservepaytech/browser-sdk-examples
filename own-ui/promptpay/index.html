<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptPay · Reservepay examples</title>
    <link rel="stylesheet" href="/shared/style.css" />
    <!-- Load the SDK from Reservepay's servers. Never bundle or self-host it (PCI). -->
    <script src="https://sdk.reservepay.com/js/v1/reservepay.js"></script>
    <!-- Any QR code library works. This one has no dependencies. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <!-- Example only: serves your merchant and installation IDs. In your shop, inline them. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <main>
      <h1>PromptPay</h1>
      <button id="pay" type="button">Pay THB 1,000.00 with PromptPay</button>
      <!-- Your own QR code UI. Scan it with a Thai mobile banking app. -->
      <div id="qr-code" class="qr-code" hidden></div>
      <p id="status"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
