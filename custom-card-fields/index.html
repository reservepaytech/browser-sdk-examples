<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom card fields · Reservepay examples</title>
    <link rel="stylesheet" href="/shared/style.css" />
    <!-- Load the SDK from Reservepay's servers. Never bundle or self-host it (PCI). -->
    <script src="https://sdk.reservepay.com/js/v1/reservepay.js"></script>
    <!-- Example only: serves your merchant and installation IDs. In your shop, inline them. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <main>
      <h1>Custom card fields</h1>
      <form id="card-form">
        <label for="cardholder-name">Cardholder name</label>
        <input id="cardholder-name" autocomplete="cc-name" required />

        <!-- Reservepay mounts a secure iframe in each container. Card data never touches your page. -->
        <label>Card number</label>
        <div id="card-number" class="field"></div>
        <label>Expiration date</label>
        <div id="expiration-date" class="field"></div>
        <label>CVV</label>
        <div id="cvv" class="field"></div>

        <button type="submit">Pay THB 1,000.00</button>
      </form>
      <!-- The 3D Secure challenge renders here when the card requires it. -->
      <div id="three-d-secure"></div>
      <p id="status"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
